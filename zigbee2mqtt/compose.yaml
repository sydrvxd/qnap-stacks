services:
    zigbee2mqtt:
        container_name: zigbee2mqtt
        restart: unless-stopped
        image: koenkk/zigbee2mqtt:latest
        volumes:
            - zigbee2mqtt-data:/app/data
            - /run/udev:/run/udev:ro
        ports:
            - 8084:8080
        environment:
            - TZ=Europe/Berlin
            # Interner Watchdog: reconnectet bei "adapter disconnected" (Retrys nach
            # 0.5/1/5/15/30 min) statt den Prozess sterben zu lassen. Ohne ihn hat ein
            # ETIMEDOUT zum SLZB-06 (192.168.1.127:6638) z2m dauerhaft lahmgelegt.
            - Z2M_WATCHDOG=0.5,1,5,15,30
        group_add:
            - dialout
        user: 1000:1000
        # Erkennt den Zombie-Zustand: Prozess haengt beim Beenden, Container bleibt "Up",
        # darum greift restart:unless-stopped nicht. node statt wget = keine Image-Annahme.
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "require('http').get('http://127.0.0.1:8080/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 120s

volumes:
  zigbee2mqtt-data:
    external: true
